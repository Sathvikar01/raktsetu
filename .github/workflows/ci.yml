name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # SQLite keeps CI dependency-free; tests isolate their own throwaway DBs.
      DATABASE_URL: file:./ci.db
      APP_SECRET: ci-insecure-secret-0123456789abcdef0123456789abcdef
      # next build evaluates production env validation — satisfy the guard.
      APP_URL: https://ci.raktsetu.invalid
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (unit / integration / security)
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: verify
    env:
      DATABASE_URL: file:./e2e.db
      APP_SECRET: ci-insecure-secret-0123456789abcdef0123456789abcdef
      APP_URL: http://127.0.0.1:3000
      DEMO_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      START_APP: "1"
      # The e2e specs drive the seeded demo donor (scripts/seed.ts).
      E2E_DONOR_EMAIL: donor@demo.local
      E2E_DONOR_PASSWORD: demo-pass-1234
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare database (schema + demo seed)
        run: |
          npm run db:push
          npm run seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
