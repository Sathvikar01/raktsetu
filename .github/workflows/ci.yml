name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # SQLite keeps CI dependency-free; tests isolate their own throwaway DBs.
      DATABASE_URL: file:./ci.db
      APP_SECRET: ci-insecure-secret-0123456789abcdef0123456789abcdef
      # next build evaluates production env validation — satisfy the guard.
      APP_URL: https://ci.raktsetu.invalid
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (unit / integration / security)
        run: npm test

      - name: Production build
        run: npm run build
